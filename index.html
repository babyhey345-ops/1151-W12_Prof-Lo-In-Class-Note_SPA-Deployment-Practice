<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BNA-EMI Week 12</title>
<style>
:root{
  --bg:#F5F8FC;--surface:#FFFFFF;--ink:#1F2A37;--muted:#5B6776;--line:#D9E1EC;--bar:#FFFFFF;--shadow:rgba(31,42,55,.12);
  --blue:#5B93D3;--red:#D6807A;--green:#74B34F;--orange:#DB9440;--pink:#D07BA3;--grey:#7D8896;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131922;--surface:#1C2430;--ink:#E7ECF3;--muted:#A3AEBD;--line:#2D384A;--bar:#1C2430;--shadow:rgba(0,0,0,.5);
    --blue:#7FB0EA;--red:#EA9D97;--green:#93CE70;--orange:#EDB062;--pink:#E595BC;--grey:#98A3B2;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131922;--surface:#1C2430;--ink:#E7ECF3;--muted:#A3AEBD;--line:#2D384A;--bar:#1C2430;--shadow:rgba(0,0,0,.5);
  --blue:#7FB0EA;--red:#EA9D97;--green:#93CE70;--orange:#EDB062;--pink:#E595BC;--grey:#98A3B2;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,.btn{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn:hover{border-color:var(--acc,var(--blue))}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--acc,var(--blue));outline-offset:2px}
.icon{width:40px;padding:0;font-size:1.2rem}
[aria-disabled="true"]{opacity:.4;pointer-events:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;visibility:hidden;transition:opacity .2s}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--surface);z-index:50;transform:translateX(-100%);visibility:hidden;transition:transform .22s,visibility .22s;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;overflow-y:auto;box-shadow:4px 0 24px var(--shadow)}
body.open #drawer{transform:none;visibility:visible}
body.open #scrim{opacity:1;visibility:visible}
#drawer h2{font-size:.95rem;margin:4px 8px 12px;color:var(--muted);font-weight:600}
#drawer a{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;color:var(--ink);text-decoration:none;border-left:5px solid var(--c)}
#drawer a+a{margin-top:4px}
#drawer a[aria-current="page"]{background:color-mix(in srgb,var(--c) 18%,var(--surface));font-weight:700}
#drawer a:hover{background:color-mix(in srgb,var(--c) 10%,var(--surface))}
main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:24px 16px 8px}
.hero{border-left:8px solid var(--acc);padding:4px 0 4px 16px;margin-bottom:20px}
.hero h2{margin:0;font-size:1.7rem;line-height:1.3}
.hero p{margin:6px 0 0;color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.card{background:color-mix(in srgb,var(--acc) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.card p{margin:0}
.card.no{border-style:dashed;background:var(--surface)}
.step{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:8px;border-radius:50%;background:var(--acc);color:var(--bg);font-weight:700;font-size:.9rem}
.links a{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:12px 14px}
.links a:hover{border-color:var(--c)}
.links b{display:block}
.links span{color:var(--muted);font-size:.92rem}
.pager{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin:28px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
.pager .mid{flex:1 1 100%;order:3}
.pager .mid .btn{width:100%}
footer{margin-top:24px;padding:16px;text-align:center;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line);background:var(--bar)}
footer p{margin:2px 0}
@media (min-width:640px){.pager .mid{flex:0 1 auto;order:0}.pager .mid .btn{width:auto}.hero h2{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="icon" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="drawer">☰</button>
  <h1 id="appTitle"></h1>
  <button id="langBtn"></button>
  <button class="icon" id="themeBtn" aria-label="Theme"></button>
</header>
<div id="scrim"></div>
<nav id="drawer" aria-label="Modules"><h2 id="drawerTitle"></h2><div id="menuList"></div></nav>
<main id="page" tabindex="-1"></main>
<footer id="foot"></footer>
<script>
(function(){
var UI={
 en:{app:"BNA-EMI Week 12",menu:"Modules",prev:"Previous page",next:"Next page",top:"Return to the top",lang:"中文",
     theme:["Switch to dark background","Switch to light background"],
     arch:"Architect: Prof. Shihmin Lo",ver:"Version 1.0 (2026-11-25)",copy:"© 2026 Prof. Shihmin Lo. All rights reserved."},
 zh:{app:"BNA-EMI 第12週",menu:"模組",prev:"上一頁",next:"下一頁",top:"回到頂端",lang:"EN",
     theme:["切換為深色背景","切換為淺色背景"],
     arch:"架構設計：Prof. Shihmin Lo",ver:"版本 1.0（2026-11-25）",copy:"© 2026 Prof. Shihmin Lo。保留所有權利。"}
};
var M=[
{id:"overview",c:"grey",t:["Overview","總覽"],s:["Business News Analysis, English Medium Instruction. Class note of 11/25/’26. Seven modules follow the note’s own process, from analysis to deployment.","商業新聞分析，英語授課。2026/11/25 課堂筆記。七個模組依筆記的流程排列，從分析到部署。"],home:1},
{id:"analysis",c:"blue",seq:1,t:["Analysis","分析"],s:["Analysis is the core of BNA, practiced through analytical thinking in four steps.","分析是 BNA 的核心，透過分析性思考分四個步驟進行。"],
 i:[["Separate","拆解","Break the whole into parts and components: the problem, the demand and the questions.","將整體拆成部分與組成要素：問題、需求與疑問。"],
    ["Investigate","深入探究","Examine each part deeply, with evidence.","以證據深入探究每個部分。"],
    ["Recombine","重新組合","Reassemble the parts and look for potential relationships.","重新組合各部分，找出潛在關係。"],
    ["Insights","洞見","Reach a new representation of the whole.","得出對整體的新呈現方式。"],
    ["Coggle mind map","Coggle 心智圖","Represent insights in a systematic, structured and process-oriented way.","以系統化、結構化、流程導向的方式呈現洞見。",0,1],
    ["Effective ✓","有效 ✓","The goal or purpose is reached. This is the criterion.","達成目標或目的，這是評判標準。",0,1],
    ["Efficient ✗","有效率 ✗","Output up, input down. Not the focus here.","產出提高、投入降低，此處不是重點。",1,1]]},
{id:"market",c:"green",t:["Market and Product","市場與產品"],s:["How supply and demand turn a product into something that can be transacted.","供給與需求如何讓產品成為可交易的對象。"],
 i:[["Market","市場","Producers (supply) and consumers (demand) meet in the market, and money ($) flows back to producers.","生產者（供給）與消費者（需求）在市場相遇，金錢（$）回流至生產者。"],
    ["Value","價值","A product carries value, measured by the willingness to pay (WTP) of the target audience (TA).","產品帶有價值，以目標受眾（TA）的支付意願（WTP）衡量。"],
    ["PRD","產品需求文件","Links product, requirements and document, and defines functions and verifications.","連結產品、需求與文件，並定義功能與驗證。"],
    ["MVP","最小可行產品","Minimum Viable Product, commercialized and ready to be transacted.","最小可行產品，已商業化並可進行交易。"],
    ["TP","學期專題","Term Project: the product moves from PRD to MVP.","學期專題：產品從 PRD 走向 MVP。"]]},
{id:"implementation",c:"red",t:["Implementation","實作"],s:["The BNA Agent is built as a product: software, an app or an application.","BNA 代理要打造成產品：軟體、App 或應用程式。"],
 i:[["BNA Agent","BNA 代理","The agent to be built as the product.","要打造成產品的代理。"],
    ["Webpage / website","網頁／網站","Delivered as a service, SaaS (Software as a Service).","以服務形式提供，即 SaaS（軟體即服務）。"],
    ["Back-end","後端","Server side.","伺服器端。"],
    ["Front-end","前端","User-facing side.","使用者端。"]]},
{id:"ai-tools",c:"green",t:["AI Tools","AI 工具"],s:["Three kinds of AI help with the work.","三種 AI 工具協助完成工作。"],
 i:[["Chatbot","聊天機器人","Conversational help.","對話式協助。"],
    ["Task agent","任務代理","Handles tasks such as discussion, consultancy and analysis.","處理討論、諮詢與分析等任務。"],
    ["Coding agent","程式代理","Writes and builds code.","撰寫並建置程式。"]]},
{id:"workflow",c:"orange",seq:1,t:["Workflow","工作流程"],s:["From class content to a deployed output.","從課堂內容到部署完成的成果。"],
 i:[["Capture","擷取","In-class notes: hand-written notes, voice recording, video, image or picture.","課堂筆記：手寫筆記、錄音、影片、圖片。"],
    ["Summary","摘要","AI converts the notes into a summary and analysis.","AI 將筆記轉為摘要與分析。"],
    ["Output","輸出","A .md file (document), .svg (diagram, unlike raster png/jpeg) or an SPA .html (single page app).",".md 檔（文件）、.svg（圖表，不同於點陣的 png/jpeg）或 SPA .html（單頁應用）。"],
    ["Deploy (部署)","部署","Publish to a deployment URL, an http:// web link.","發佈至部署網址（http:// 連結）。"]]},
{id:"team",c:"blue",t:["Team Collaboration","團隊協作"],s:["Team members share one AI session and pass context through three files.","團隊成員共用一個 AI 工作階段，並透過三個檔案傳遞脈絡。"],
 i:[["Session","共用工作階段","One shared AI session. Team member #1 and #2 take turns.","一個共用的 AI 工作階段，成員 1 與成員 2 輪流使用。"],
    ["KB.md","KB.md","The knowledge base.","知識庫。"],
    ["handoff.md","handoff.md","Passes context to the next member.","將脈絡交接給下一位成員。"],
    ["PRD.md","PRD.md","The product requirements.","產品需求。"],
    ["Skills","能力","Creativity and critical thinking.","創意與批判性思考。"]]},
{id:"style",c:"pink",t:["Output Style","輸出風格"],s:["Rules for how every output should look.","所有成果外觀的規則。"],
 i:[["Style","風格","Simple, clear and light-colored.","簡單、清晰、淺色。"],
    ["In portrait ✓","直式 ✓","For mobile phone devices.","適用手機裝置。"],
    ["Landscape ✗","橫式 ✗","Notebook PC or TV display. Avoid.","筆電或電視螢幕。避免使用。",1]]}
];
var $=function(s){return document.querySelector(s)};
var L="en",page=$("#page"),root=document.documentElement;
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function pick(a){return a[L==="en"?0:1]}
function idx(){var h=location.hash.slice(1);for(var n=0;n<M.length;n++)if(M[n].id===h)return n;return 0}
function dark(){var a=root.getAttribute("data-theme");return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function chrome(){
  var u=UI[L];root.lang=L==="en"?"en":"zh-Hant";
  $("#appTitle").textContent=u.app;$("#langBtn").textContent=u.lang;$("#drawerTitle").textContent=u.menu;
  $("#menuBtn").setAttribute("aria-label",u.menu);
  var d=dark();$("#themeBtn").textContent=d?"☀":"☾";$("#themeBtn").setAttribute("aria-label",u.theme[d?1:0]);
  $("#foot").innerHTML="<p><b>"+u.arch+"</b></p><p>"+u.ver+"</p><p>"+u.copy+"</p>";
  document.title=u.app;
}
function menu(n){
  $("#menuList").innerHTML=M.map(function(m,i){
    return '<a href="#'+m.id+'" style="--c:var(--'+m.c+')"'+(i===n?' aria-current="page"':'')+'>'+(i?i+". ":"")+pick(m.t)+'</a>';
  }).join("");
}
function render(){
  var n=idx(),m=M[n],u=UI[L],h="";
  page.style.setProperty("--acc","var(--"+m.c+")");
  h+='<div class="hero"><h2>'+(n?n+". ":"")+pick(m.t)+'</h2><p>'+pick(m.s)+'</p></div>';
  if(m.home){
    h+='<div class="grid links">'+M.slice(1).map(function(x,i){return '<a href="#'+x.id+'" style="--c:var(--'+x.c+')"><b>'+(i+1)+". "+pick(x.t)+'</b><span>'+pick(x.s)+'</span></a>'}).join("")+'</div>';
  }else{
    h+='<div class="grid">'+m.i.map(function(c,i){
      var k=L==="en"?0:1;
      return '<div class="card'+(c[4]?" no":"")+'"><h3>'+(m.seq&&!c[5]?'<span class="step">'+(i+1)+'</span>':'')+c[k]+'</h3><p>'+c[2+k]+'</p></div>';
    }).join("")+'</div>';
  }
  var p=n>0?M[n-1].id:null,q=n<M.length-1?M[n+1].id:null;
  h+='<div class="pager"><a class="btn" '+(p?'href="#'+p+'"':'aria-disabled="true"')+'>‹ '+u.prev+'</a>'
   +'<span class="mid"><button type="button" id="topBtn">'+u.top+' ↑</button></span>'
   +'<a class="btn" '+(q?'href="#'+q+'"':'aria-disabled="true"')+'>'+u.next+' ›</a></div>';
  page.innerHTML=h;
  $("#topBtn").onclick=function(){scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})};
  menu(n);chrome();
}
function setOpen(o){document.body.classList.toggle("open",o);$("#menuBtn").setAttribute("aria-expanded",o)}
$("#menuBtn").onclick=function(){setOpen(!document.body.classList.contains("open"))};
$("#scrim").onclick=function(){setOpen(false)};
$("#menuList").onclick=function(e){if(e.target.closest("a"))setOpen(false)};
document.addEventListener("keydown",function(e){if(e.key==="Escape")setOpen(false)});
$("#langBtn").onclick=function(){L=L==="en"?"zh":"en";put("bnaLang",L);render()};
$("#themeBtn").onclick=function(){var v=dark()?"light":"dark";root.setAttribute("data-theme",v);put("bnaTheme",v);chrome()};
addEventListener("hashchange",function(){render();scrollTo(0,0)});
var sl=get("bnaLang");L=sl==="zh"||sl==="en"?sl:((navigator.language||"").toLowerCase().indexOf("zh")===0?"zh":"en");
var st=get("bnaTheme");if(st==="dark"||st==="light")root.setAttribute("data-theme",st);
render();
})();
</script>
</body>
</html>
